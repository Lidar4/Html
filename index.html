<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>আমার মাল্টি-পাস স্টোর</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; padding: 10px; }
        .tab-btn { background: #334155; border: none; padding: 10px; width: 48%; color: white; cursor: pointer; }
        .active { background: #22c55e; }
        .section { display: none; margin-top: 20px; }
        .show { display: block; }
    </style>
</head>
<body>

<button class="tab-btn active" onclick="show('movies')">মুভি জোন</button>
<button class="tab-btn" onclick="show('news')">খবর জোন</button>

<div id="movies" class="section show">
    <h3>মুভি বাটন প্যানেল এখানে</h3>
    </div>

<div id="news" class="section">
    <h3>অটোমেটিক খবর</h3>
    <script src="https://widget.feed.press/widget.js" data-feed="https://www.prothomalo.com/feed/"></script>
</div>

<script>
    function show(id) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('show'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('show');
        event.currentTarget.classList.add('active');
    }
</script>
</body>
</html>
