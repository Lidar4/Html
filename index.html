<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>স্বাগতম | লিডার৪ অফিশিয়াল</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #0f172a, #1e293b); color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 35px 25px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .avatar { width: 100px; height: 100px; background: linear-gradient(45deg, #3b82f6, #8b5cf6); border-radius: 50%; margin: 0 auto 20px; display: flex; justify-content: center; align-items: center; font-size: 40px; box-shadow: 0 0 20px rgba(139, 92, 246, 0.4); }
        h1 { font-size: 24px; margin-bottom: 8px; color: #fff; font-weight: 600; }
        p { font-size: 14px; color: #94a3b8; margin-bottom: 25px; line-height: 1.5; }
        .links-container { display: flex; flex-direction: column; gap: 15px; }
        .link-btn { display: block; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: #fff; padding: 14px; border-radius: 12px; text-decoration: none; font-size: 15px; font-weight: 500; transition: all 0.3s ease; }
        .link-btn:hover { background: #3b82f6; border-color: #3b82f6; transform: translateY(-3px); box-shadow: 0 5px 15px rgba(59, 130, 246, 0.4); }
        .footer { margin-top: 30px; font-size: 12px; color: #64748b; }
    </style>
</head>
<body>

<div class="card">
    <div class="avatar">🌐</div>
    <h1>লিডার৪ (Lidar4)</h1>
    <p>আমার প্রথম টেস্ট ওয়েবসাইট ইন্টারফেস। এটি সম্পূর্ণ পরিবর্তনযোগ্য এবং পরবর্তীতে যেকোনো সময় এডিট বা ডিলিট করা যাবে।</p>
    
    <div class="links-container">
        <a href="https://github.com/Lidar4" target="_blank" class="link-btn">গিটহাব প্রোফাইল</a>
        <a href="#" class="link-btn">ফেসবুক পেজ</a>
        <a href="#" class="link-btn">ইউটিউব চ্যানেল</a>
    </div>
    
    <div class="footer">
        © 2026 | তৈরি করেছেন Lidar4
    </div>
</div>

</body>
</html>
