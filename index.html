<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Apps & Tools Hub</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #0b0f19, #111827); color: #f3f4f6; padding: 30px 15px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        .header { text-align: center; margin-bottom: 40px; max-width: 500px; }
        .header h1 { font-size: 28px; color: #3b82f6; font-weight: 700; margin-bottom: 10px; }
        .header p { font-size: 14px; color: #9ca3af; line-height: 1.5; }
        .container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 20px; }
        .app-card { background: #1f2937; border: 1px solid #374151; border-radius: 16px; padding: 20px; display: flex; align-items: center; justify-content: space-between; transition: transform 0.2s, box-shadow 0.2s; }
        .app-card:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4); border-color: #4b5563; }
        .app-info { display: flex; align-items: center; gap: 15px; }
        .app-icon { width: 50px; height: 50px; background: #374151; border-radius: 12px; display: flex; justify-content: center; align-items: center; font-size: 24px; color: #fff; }
        .app-details h3 { font-size: 16px; color: #fff; margin-bottom: 4px; font-weight: 600; }
        .app-details p { font-size: 12px; color: #9ca3af; }
        .download-btn { background: #2563eb; color: #fff; text-decoration: none; padding: 10px 16px; border-radius: 8px; font-size: 14px; font-weight: 600; transition: background 0.2s; text-align: center; }
        .download-btn:hover { background: #1d4ed8; }
        .footer { margin-top: auto; padding-top: 40px; font-size: 12px; color: #6b7280; text-align: center; }
    </style>
</head>
<body>

<div class="header">
    <h1>Premium Premium Hub 🚀</h1>
    <p>আপনার প্রয়োজনীয় সকল প্রিমিয়াম অ্যাপ এবং মেটেরিয়ালস ফ্রিতে ডাউনলোড করুন একদম সেফ ও নিরাপদ লিংকের মাধ্যমে।</p>
</div>

<div class="container">
    <!-- CapCut Pro Card -->
    <div class="app-card">
        <div class="app-info">
            <div class="app-icon">🎬</div>
            <div class="app-details">
                <h3>CapCut Pro Mod</h3>
                <p>Size: ~210 MB | v12.1.0</p>
            </div>
        </div>
        <!-- নিচে href="#" এর জায়গায় আপনার লিংক শর্টনারের দেওয়া অ্যাড লিংকটি বসাবেন -->
        <a href="YOUR_SHORTLINK_HERE" class="download-btn">Download</a>
    </div>

    <!-- নতুন কোনো অ্যাপ যোগ করতে চাইলে এই নিচের কার্ডটি ব্যবহার করতে পারবেন -->
    <div class="app-card">
        <div class="app-info">
            <div class="app-icon">🎨</div>
            <div class="app-details">
                <h3>Alight Motion Pro</h3>
                <p>Size: ~95 MB | Premium</p>
            </div>
        </div>
        <a href="YOUR_SHORTLINK_HERE" class="download-btn">Download</a>
    </div>
</div>

<div class="footer">
    © 2026 | Secured & Controlled by Owner
</div>

</body>
</html>
