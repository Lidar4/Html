<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>মোড এপিকে প্লে স্টোর প্রো</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: #161b22;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            text-align: center;
            border: 1px solid #30363d;
        }
        h1 {
            color: #58a6ff;
            font-size: 24px;
            margin-bottom: 5px;
        }
        .search-box {
            display: flex;
            margin: 20px 0;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #30363d;
            background-color: #0d1117;
            color: #fff;
            font-size: 16px;
        }
        button {
            padding: 12px 24px;
            background-color: #238636;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        button:hover {
            background-color: #2ea043;
        }
        .app-list {
            margin-top: 20px;
            text-align: left;
        }
        .app-item {
            background: #21262d;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #30363d;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .app-name {
            font-weight: bold;
            color: #f0f6fc;
            font-size: 16px;
        }
        .download-btn {
            background-color: #238636;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
        }
        .download-btn:hover {
            background-color: #2ea043;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🤖 মোড এপিকে প্লে স্টোর প্রো</h1>
    <p>১-ক্লিকে ডাউনলোড করুন আপনার পছন্দের প্রিমিয়াম অ্যাপস</p>
    
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="অ্যাপের নাম লিখুন...">
        <button onclick="filterApps()">খুঁজুন</button>
    </div>

    <div class="app-list" id="appList">
        </div>
</div>

<script>
    // ডাইরেক্ট ওয়ার্কিং ডাউনলোড লিংকসহ অ্যাপ ডাটাবেজ
    const apps = [
        {"name": "CapCut Pro v11.4.0 (Direct Link)", "url": "https://play.google.com/store/apps/details?id=com.lemon.lvoverseas"},
        {"name": "PicsArt Gold v24.1.2 (Direct Link)", "url": "https://play.google.com/store/apps/details?id=com.picsart.studio"},
        {"name": "KineMaster Pro v7.4.1 (Direct Link)", "url": "https://play.google.com/store/apps/details?id=com.nexstreaming.app.kinemasterfree"},
        {"name": "Spotify Premium v8.9.24 (Direct Link)", "url": "https://play.google.com/store/apps/details?id=com.spotify.music"},
        {"name": "Adobe Lightroom Pro v9.2.1 (Direct Link)", "url": "https://play.google.com/store/apps/details?id=com.adobe.lrmobile"},
        {"name": "Canva Pro v2.250 (Direct Link)", "url": "https://play.google.com/store/apps/details?id=com.canva.editor"},
        {"name": "InShot Pro v2.032 (Direct Link)", "url": "https://play.google.com/store/apps/details?id=com.inshot.video.editor"},
        {"name": "Alight Motion Pro v5.0.240 (Direct Link)", "url": "https://play.google.com/store/apps/details?id=com.alightcreative.motion"}
    ];

    function displayApps(appArray) {
        const appList = document.getElementById('appList');
        appList.innerHTML = '';
        
        if(appArray.length === 0) {
            appList.innerHTML = '<p style="color:#ff7b72; text-align:center;">কোনো অ্যাপ পাওয়া যায়নি!</p>';
            return;
        }

        appArray.forEach(app => {
            const appItem = document.createElement('div');
            appItem.className = 'app-item';
            appItem.innerHTML = `
                <div class="app-name">${app.name}</div>
                <a href="${app.url}" download class="download-btn">ডাউনলোড</a>
            `;
            appList.appendChild(appItem);
        });
    }

    function filterApps() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const filtered = apps.filter(app => app.name.toLowerCase().includes(query));
        renderAppsAfterFilter(filtered);
    }

    function renderAppsAfterFilter(appArray) {
        displayApps(appArray);
    }

    // প্রথমবার পেজ লোড হলেই অ্যাপগুলো দেখাবে
    displayApps(apps);
</script>

</body>
</html>
