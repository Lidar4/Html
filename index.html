<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>প্রো স্টোর</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; padding: 15px; }
        .admin { background: #1e293b; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
        input { width: 100%; padding: 10px; margin: 5px 0; border-radius: 5px; border: none; }
        button { background: #22c55e; color: white; padding: 10px; width: 100%; border: none; border-radius: 5px; cursor: pointer; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .card { background: #1e293b; padding: 10px; border-radius: 10px; text-align: center; }
        .card img { width: 100%; height: 120px; object-fit: cover; border-radius: 5px; }
        .btn-down { background: #3b82f6; display: block; margin-top: 5px; padding: 5px; text-decoration: none; color: white; border-radius: 5px; }
    </style>
</head>
<body>

<div class="admin">
    <h3>নতুন কিছু যোগ করুন</h3>
    <input type="text" id="name" placeholder="নাম">
    <input type="text" id="img" placeholder="ছবির লিংক">
    <input type="text" id="link" placeholder="ডাউনলোড লিংক">
    <button onclick="add()">পোস্ট করুন</button>
    <button onclick="clearAll()" style="background:#ef4444; margin-top:10px;">সব ডাটা মুছুন (Clear All)</button>
</div>

<div class="grid" id="list"></div>

<script>
    let data = JSON.parse(localStorage.getItem('myStore')) || [];
    function add() {
        data.push({n:document.getElementById('name').value, i:document.getElementById('img').value, l:document.getElementById('link').value});
        localStorage.setItem('myStore', JSON.stringify(data));
        render();
    }
    function clearAll() {
        if(confirm("আপনি কি নিশ্চিত সব মুছতে চান?")) {
            localStorage.removeItem('myStore');
            data = [];
            render();
        }
    }
    function render() {
        document.getElementById('list').innerHTML = data.map(c => `
            <div class="card">
                <img src="${c.i}">
                <p style="font-size:12px;">${c.n}</p>
                <a href="${c.l}" class="btn-down" download>ডাউনলোড</a>
            </div>
        `).join('');
    }
    render();
</script>
</body>
</html>
