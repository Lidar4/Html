<body>

    <header>
        <div class="container">
            <h1>GML Tools Hub</h1>
            <nav>
                <a href="index.html">হোম</a>
                <a href="#">টুলস তালিকা</a>
                <a href="contact.html">যোগাযোগ</a>
            </nav>
        </div>
    </header>

    <section class="hero">
        <div class="container">
            <h2>অনলাইন দরকারি টুলস হাব</h2>
            <p>আপনার দৈনন্দিন কাজের প্রয়োজনীয় টুলসগুলো ব্যবহার করুন এক জায়গায়</p>
            <a href="#tools" class="btn" style="background:#10B981; color:white; text-decoration:none; padding:14px 30px; border-radius:10px; font-size:18px; display:inline-block; font-weight:600;">টুলস ব্যবহার করুন</a>
        </div>
    </section>

<section class="tools" id="tools" style="padding: 70px 0; text-align: center;">
  <div class="container" style="background: white; padding: 40px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,.08); max-width: 500px; margin: auto;">
    <h2 style="margin-bottom: 20px; color: #1E3A8A;">Age Calculator</h2>

    <input type="date" id="birthDate" style="width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px;">

    <button onclick="calculateAge()" style="background: #10B981; color: white; border: none; padding: 12px 25px; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: bold; width: 100%;">
      Calculate Age
    </button>

    <h3 id="result" style="margin-top: 25px; color: #2563EB; font-size: 22px;"></h3>
  </div>
</section>

<script>
function calculateAge() {
    let birthDate =
        new Date(document.getElementById('birthDate').value);

    let today = new Date();

    let age =
        today.getFullYear() - birthDate.getFullYear();

    let month =
        today.getMonth() - birthDate.getMonth();

    if (
        month < 0 ||
        (month === 0 &&
        today.getDate() < birthDate.getDate())
    ) {
        age--;
    }

    document.getElementById('result').innerHTML =
        "Your Age: " + age + " Years";
}
</script>
