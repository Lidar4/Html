<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>প্রো এপিকে স্টোর</title>
    <style>
        body { font-family: sans-serif; background: #f8f8f8; margin: 0; padding: 10px; }
        .app-card { background: white; padding: 15px; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .app-header { display: flex; align-items: center; margin-bottom: 10px; }
        .app-icon { width: 60px; height: 60px; background: #e74c3c; border-radius: 10px; margin-right: 15px; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; }
        .app-title { font-size: 18px; font-weight: bold; margin: 0; }
        .rating { color: #f1c40f; font-size: 14px; }
        .download-btn { background: #00a859; color: white; text-align: center; padding: 12px; border-radius: 5px; font-weight: bold; text-decoration: none; display: block; margin: 10px 0; }
        .description { font-size: 14px; color: #555; line-height: 1.5; margin-top: 10px; }
        .tags { font-size: 12px; color: #777; margin-top: 10px; border-top: 1px solid #eee; padding-top: 5px; }
    </style>
</head>
<body>

<div id="appList"></div>

<script>
    const apps = [
        { name: "অ্যাডোবি রিডার ডিসি", rating: "★ 3.9", desc: "উইন্ডোজের জন্য এটি একটি চমৎকার পিডিএফ রিডার ও ডকুমেন্ট ম্যানেজমেন্ট টুল।", link: "#" },
        { name: "স্পাইডার-ম্যান আনলিমিটেড", rating: "★ 4.3", desc: "মার্ভেল ইউনিভার্সের জনপ্রিয় একটি অ্যাকশন গেম, যা এখন আপনার মোবাইলে।", link: "#" }
    ];

    const container = document.getElementById('appList');
    apps.forEach(app => {
        container.innerHTML += `
            <div class="app-card">
                <div class="app-header">
                    <div class="app-icon">${app.name[0]}</div>
                    <div>
                        <p class="app-title">${app.name}</p>
                        <p class="rating">${app.rating} · বিনামুল্যে</p>
                    </div>
                </div>
                <a href="${app.link}" class="download-btn">ডাউনলোড করুন</a>
                <p class="description">${app.desc}</p>
                <p class="tags">অ্যান্ড্রয়েড | মোড | প্রিমিয়াম</p>
            </div>
        `;
    });
</script>

</body>
</html>
