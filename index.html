<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>মোড এপিকে প্লে স্টোর প্রো</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: #161b22;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            text-align: center;
            border: 1px solid #30363d;
        }
        h1 {
            color: #58a6ff;
            font-size: 24px;
            margin-bottom: 5px;
        }
        .search-box {
            display: flex;
            margin: 20px 0;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #30363d;
            background-color: #0d1117;
            color: #fff;
            font-size: 16px;
        }
        button {
            padding: 12px 24px;
            background-color: #238636;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        button:hover {
            background-color: #2ea043;
        }
        .app-list {
            margin-top: 20px;
            text-align: left;
        }
        .app-item {
            background: #21262d;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #30363d;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .app-name {
            font-weight: bold;
            color: #f0f6fc;
            font-size: 16px;
        }
        .download-btn {
            background-color: #1f6feb;
            color: white;
            padding: 8px 16px;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
        }
        .download-btn:hover {
            background-color: #388bfd;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🤖 মোড এপিকে প্লে স্টোর প্রো</h1>
    <p>খুঁজুন আপনার পছন্দের প্রিমিয়াম অ্যাপের লেটেস্ট মোড ভার্সন</p>
    
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="অ্যাপের নাম লিখুন...">
        <button onclick="filterApps()">খুঁজুন</button>
    </div>

    <div class="app-list" id="appList">
        </div>
</div>

<script>
    // বিশ্বের সেরা ১৫টি প্রো অ্যাপের ডেটা সরাসরি কোডের ভেতরেই দিয়ে দেওয়া হলো
    const apps = [
        {"name": "CapCut Pro v11.4.0 (Premium Unlocked)", "url": "https://apkdone.com/capcut/"},
        {"name": "PicsArt Gold v24.1.2 (Premium Mod)", "url": "https://apkdone.com/picsart/"},
        {"name": "KineMaster Pro v7.4.1 (No Watermark)", "url": "https://apkdone.com/kinemaster-1/"},
        {"name": "Spotify Premium v8.9.24 (Mega Mod Menu)", "url": "https://modapk.co/spotify-premium-apk/"},
        {"name": "Adobe Lightroom Pro v9.2.1 (Full Unlocked)", "url": "https://apkdone.com/adobe-lightroom/"},
        {"name": "Canva Pro v2.250 (Premium Subscription)", "url": "https://modapk.co/canva-pro-apk/"},
        {"name": "InShot Pro v2.032 (All Paid Packs Unlocked)", "url": "https://apkdone.com/inshot-pro/"},
        {"name": "Alight Motion Pro v5.0.240 (No Lag/Watermark)", "url": "https://apkdone.com/alight-motion/"},
        {"name": "Truecaller Premium Gold v14.5.6 (Full Mod)", "url": "https://modapk.co/truecaller-premium-apk/"},
        {"name": "PowerDirector Pro v13.1.0 (Premium Unlocked)", "url": "https://apkdone.com/powerdirector/"},
        {"name": "Netflix Premium v10.6.4 (4K HDR Mod/Free Watch)", "url": "https://modapk.co/netflix-premium-apk/"},
        {"name": "MX Player Pro v1.85.0 (Ad-Free/All Codecs)", "url": "https://apkdone.com/mx-player-pro/"},
        {"name": "WPS Office Premium v18.7 (All Features Unlocked)", "url": "https://apkdone.com/wps-office/"},
        {"name": "VPN Inf Pro v7.8.0 (Unlimited High Speed VIP)", "url": "https://apkdone.com/vpn-inf/"},
        {"name": "PixelLab Pro v2.1.3 (Dark/Plus Fonts Unlocked)", "url": "https://apkdone.com/pixellab/"}
    ];

    function displayApps(appArray) {
        const appList = document.getElementById('appList');
        appList.innerHTML = '';
        
        if(appArray.length === 0) {
            appList.innerHTML = '<p style="color:#ff7b72; text-align:center;">কোনো অ্যাপ পাওয়া যায়নি!</p>';
            return;
        }

        appArray.forEach(app => {
            const appItem = document.createElement('div');
            appItem.className = 'app-item';
            appItem.innerHTML = `
                <div class="app-name">${app.name}</div>
                <a href="${app.url}" target="_blank" class="download-btn">ডাউনলোড</a>
            `;
            appList.appendChild(appItem);
        });
    }

    function filterApps() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const filtered = apps.filter(app => app.name.toLowerCase().includes(query));
        displayApps(filtered);
    }

    // পেজ লোড হলেই অ্যাপগুলো স্ক্রিনে চলে আসবে
    displayApps(apps);
</script>

</body>
</html>
