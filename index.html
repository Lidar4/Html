<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>মোড এপিকে প্লে স্টোর প্রো</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="store-container">
        <h1 class="store-title">🤖 মোড এপিকে প্লে স্টোর প্রো</h1>
        <p class="store-subtitle">খুঁজুন আপনার পছন্দের প্রিমিয়াম অ্যাপের লেটেস্ট মোড ভার্সন</p>

        <div class="ad-box">
            <span>📢 SPONSORED AD</span>
            <p>(টার্মাক্স অটো-প্লেসমেন্ট অ্যাড জোন)</p>
        </div>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Cap cut...">
            <button id="searchBtn">খুঁজুন</button>
        </div>

        <!-- অ্যাপ লিস্ট দেখানোর মেইন জায়গা -->
        <div class="app-list" id="appList">
            <p style="color: #666; text-align: center;">অ্যাপ লোড হচ্ছে...</p>
        </div>
    </div>

    <!-- বাটন ও সার্চ সচল করার জাভাস্ক্রিপ্ট কোড -->
    <script>
        let allApps = [];

        // apps.json থেকে ডাটাবেজ লোড করা
        fetch('apps.json')
            .then(response => response.json())
            .then(data => {
                allApps = data;
                displayApps(allApps);
            })
            .catch(err => {
                console.error("ডাটাবেজ পাওয়া যায়নি:", err);
                document.getElementById('appList').innerHTML = '<p style="color: red; text-align: center;">অ্যাপ ডাটাবেজ লোড হতে পারেনি!</p>';
            });

        // অ্যাপস স্ক্রিনে দেখানোর ফাংশন
        function displayApps(apps) {
            const appList = document.getElementById('appList');
            appList.innerHTML = '';
            
            if(apps.length === 0) {
                appList.innerHTML = '<p style="color: #ff4757; text-align: center;">কোনো অ্যাপ পাওয়া যায়নি!</p>';
                return;
            }

            apps.forEach(app => {
                const appCard = document.createElement('div');
                appCard.className = 'app-card';
                appCard.style = 'background: #1e272e; padding: 15px; border-radius: 10px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #00d2d3;';
                appCard.innerHTML = `
                    <div>
                        <h3 style="color: #fff; margin: 0;">${app.name}</h3>
                        <span style="color: #1dd1a1; font-size: 12px;">ভার্সন: লেটেস্ট মোড</span>
                    </div>
                    <a href="${app.download_url}" target="_blank" style="background: #1dd1a1; color: #000; padding: 8px 15px; border-radius: 5px; text-decoration: none; font-weight: bold;">ডাউনলোড</a>
                `;
                appList.appendChild(appCard);
            });
        }

        // সার্চ বাটনের কাজ
        document.getElementById('searchBtn').addEventListener('click', () => {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filteredApps = allApps.filter(app => app.name.toLowerCase().includes(query));
            displayApps(filteredApps);
        });

        // এন্টার চাপলে সার্চ হওয়ার কায়দা
        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const query = e.target.value.toLowerCase();
                const filteredApps = allApps.filter(app => app.name.toLowerCase().includes(query));
                displayApps(filteredApps);
            }
        });
    </script>
</body>
</html>
