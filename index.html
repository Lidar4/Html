<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>মোড এপিকে প্লে স্টোর প্রো</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0b0f19; color: #ffffff; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .store-container { width: 100%; max-width: 600px; }
        .store-title { text-align: center; color: #00ff88; font-size: 28px; margin-bottom: 5px; text-shadow: 0 0 10px rgba(0,255,136,0.3); }
        .store-subtitle { text-align: center; color: #8a99ad; font-size: 14px; margin-bottom: 25px; }
        .ad-box { background: rgba(255, 255, 255, 0.03); border: 1px dashed #ff9f43; border-radius: 8px; padding: 12px; text-align: center; margin-bottom: 20px; font-size: 12px; color: #ff9f43; }
        .search-box { display: flex; gap: 10px; margin-bottom: 25px; }
        .search-box input { flex: 1; padding: 12px; border-radius: 8px; border: 2px solid #1e293b; background: #111827; color: #fff; font-size: 16px; outline: none; }
        .search-box input:focus { border-color: #00ff88; }
        .search-box button { background: #00ff88; color: #000; border: none; padding: 0 25px; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; }
        .app-list { display: flex; flex-direction: column; gap: 12px; }
        .app-card { background: #1e293b; padding: 15px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid rgba(0, 255, 136, 0.15); box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        .app-info h3 { margin: 0 0 5px 0; color: #ffffff; font-size: 16px; }
        .app-info span { font-size: 12px; color: #00ff88; background: rgba(0, 255, 136, 0.1); padding: 2px 8px; border-radius: 4px; }
        .app-site { font-size: 11px; color: #8a99ad; margin-top: 5px; display: block; }
        .download-btn { background: #00ff88; color: #000; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 14px; transition: 0.2s; }
        .download-btn:hover { background: #00cc6a; transform: scale(1.05); }
        .status-msg { text-align: center; color: #8a99ad; padding: 20px; }
    </style>
</head>
<body>

    <div class="store-container">
        <h1 class="store-title">🤖 মোড এপিকে প্লে স্টোর প্রো</h1>
        <p class="store-subtitle">বিশ্বের শীর্ষ ৫টি সাইট থেকে অটো-আপডেটেড প্রো ও প্রিমিয়াম অ্যাপস</p>

        <div class="ad-box">
            <span>📢 SPONSORED AD</span>
            <p>(টার্মাক্স অটো-প্লেসমেন্ট অ্যাড জোন)</p>
        </div>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="আপনার পছন্দের প্রো অ্যাপটি খুঁজুন...">
            <button id="searchBtn">খুঁজুন</button>
        </div>

        <div class="app-list" id="appList">
            <p class="status-msg">লেটেস্ট প্রো অ্যাপগুলো লাইভ কানেক্ট করা হচ্ছে...</p>
        </div>
    </div>

    <script>
        // বিশ্বের শীর্ষ ৫টি মোড সাইটের RSS Feed এপিআই সোর্স (CORS Proxy সহ)
        const sources = [
            { name: "APKPure Premium Feed", url: "https://api.rss2json.com/v1/api.json?rss_url=https://apkpure.com/feed" },
            { name: "ModAPK.co Engine", url: "https://api.rss2json.com/v1/api.json?rss_url=https://modapk.co/feed/" },
            { name: "APKModDone Pro Feed", url: "https://api.rss2json.com/v1/api.json?rss_url=https://apkdone.com/feed/" },
            { name: "GetModFiles Source", url: "https://api.rss2json.com/v1/api.json?rss_url=https://getmodmods.com/feed/" },
            { name: "An1 Pro Library", url: "https://api.rss2json.com/v1/api.json?rss_url=https://an1.com/feed/" }
        ];

        let masterAppList = [];

        async function fetchAllSources() {
            const appListContainer = document.getElementById('appList');
            
            for (let source of sources) {
                try {
                    const response = await fetch(source.url);
                    const data = await response.json();
                    
                    if (data.status === 'ok' && data.items) {
                        data.items.forEach(item => {
                            // শুধু মোড বা প্রো অ্যাপগুলোকে ফিল্টার করার শক্তিশালী কন্ডিশন
                            const title = item.title;
                            if (title.toLowerCase().includes('mod') || title.toLowerCase().includes('pro') || title.toLowerCase().includes('premium') || title.toLowerCase().includes('apk')) {
                                masterAppList.push({
                                    name: title,
                                    download_url: item.link,
                                    source_site: source.name
                                });
                            }
                        });
                    }
                } catch (error) {
                    console.log(source.name + " সংযোগে সমস্যা কিন্তু সিস্টেম সচল আছে।");
                }
            }

            // ডুপ্লিকেট অ্যাপ বাদ দেওয়া
            masterAppList = masterAppList.filter((app, index, self) =>
                index === self.findIndex((t) => t.name === app.name)
            );

            // লেটেস্ট অ্যাপগুলো আগে দেখানোর জন্য সর্টিং
            renderApps(masterAppList);
        }

        function renderApps(apps) {
            const appListContainer = document.getElementById('appList');
            appListContainer.innerHTML = '';

            if (apps.length === 0) {
                appListContainer.innerHTML = '<p class="status-msg" style="color: #ff4757;">কোনো নতুন প্রো অ্যাপ এই মুহূর্তে পাওয়া যায়নি!</p>';
                return;
            }

            apps.forEach(app => {
                const card = document.createElement('div');
                card.className = 'app-card';
                card.innerHTML = `
                    <div class="app-info">
                        <h3>${app.name}</h3>
                        <span>Premium Mod</span>
                        <small class="app-site">সোর্স: ${app.source_site}</small>
                    </div>
                    <a href="${app.download_url}" target="_blank" class="download-btn">ডাউনলোড</a>
                `;
                appListContainer.appendChild(card);
            });
        }

        // সার্চ করার ফাংশন
        function filterApps() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = masterAppList.filter(app => app.name.toLowerCase().includes(query));
            renderApps(filtered);
        }

        document.getElementById('searchBtn').addEventListener('click', filterApps);
        document.getElementById('searchInput').addEventListener('keyup', (e) => {
            if (e.key === 'Enter') filterApps();
        });

        // ওয়েবসাইট ওপেন হলেই ব্যাকএন্ড রান হবে
        fetchAllSources();
    </script>
</body>
</html>
