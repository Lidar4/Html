<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ডাউনলোড সেন্টার</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #ffffff; color: #000000; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .main-box { text-align: center; border: 2px solid #000000; padding: 40px 20px; border-radius: 8px; max-width: 400px; width: 100%; }
        h1 { font-size: 22px; margin-bottom: 15px; }
        p { font-size: 14px; margin-bottom: 25px; color: #555555; }
        .enter-btn { background-color: #000000; color: #ffffff; padding: 12px 30px; text-decoration: none; font-size: 16px; font-weight: bold; border-radius: 4px; display: inline-block; }
        .enter-btn:hover { background-color: #333333; }
    </style>
</head>
<body>

<div class="main-box">
    <h1>অ্যাপস ডাউনলোড সেন্টার</h1>
    <p>আমাদের প্রিমিয়াম অ্যাপসের লিস্টে প্রবেশ করতে নিচের বাটনে ক্লিক করুন।</p>
    
    <!-- এই বাটনে ক্লিক করলে মানুষ অ্যাপের লিস্টে যাবে -->
    <a href="#" class="enter-btn">প্রবেশ করুন</a>
</div>

</body>
</html>
