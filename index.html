<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>প্রো এপিকে আপলোডার</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; padding: 20px; }
        .box { background: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        input { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { background: #28a745; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
        .app-card { background: white; padding: 15px; margin-bottom: 10px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>
    <div class="box">
        <h3>নতুন অ্যাপ যুক্ত করুন</h3>
        <input type="text" id="name" placeholder="অ্যাপের নাম">
        <input type="text" id="link" placeholder="টেলিগ্রাম/ডাউনলোড লিংক">
        <button onclick="addApp()">যুক্ত করুন</button>
    </div>
    <div id="appList"></div>

    <script>
        let apps = JSON.parse(localStorage.getItem('myApps')) || [];
        
        function addApp() {
            const name = document.getElementById('name').value;
            const link = document.getElementById('link').value;
            if(name && link) {
                apps.push({name, link});
                localStorage.setItem('myApps', JSON.stringify(apps));
                render();
            }
        }

        function render() {
            const list = document.getElementById('appList');
            list.innerHTML = '';
            apps.forEach(app => {
                list.innerHTML += `<div class="app-card"><span>${app.name}</span><a href="${app.link}" target="_blank">ডাউনলোড</a></div>`;
            });
        }
        render();
    </script>
</body>
</html>
